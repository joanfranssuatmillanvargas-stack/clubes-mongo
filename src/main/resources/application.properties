spring.application.name=clubes-mongo
# Puerto: 8108 en tu PC y en Render (en Render se pone la variable PORT=8108)
server.port=${PORT:8108}

# ===== MongoDB Atlas =====
# La URL con la contraseña NO va en el código (para no subirla a GitHub):
#  - En tu PC se lee del archivo secreto.properties (está en .gitignore)
#  - En Render se lee de la variable de entorno MONGODB_URI
spring.config.import=optional:classpath:secreto.properties
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=clubesdb

spring.thymeleaf.cache=false

# La sesión viaja solo en cookie (evita que Tomcat agregue ;jsessionid=... a las URL)
server.servlet.session.tracking-modes=cookie
